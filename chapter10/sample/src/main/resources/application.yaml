request-id:
  header:
    name: X-Trace-Id
  cache:
    ttl: 30s
    max-size: 512KB
  path-strategies:
    "[/api/admin/**]": X-Admin-Request-Id
    "[/api/auth/**]": X-Auth-Trace-Id
    "[/**]": X-Request-Id
  propagate-headers:
  header-name: X-Request-Id

spring:
  main:
    banner-mode: off
logging:
  pattern:
    console: "%-5level %logger{36} : %msg%n"
