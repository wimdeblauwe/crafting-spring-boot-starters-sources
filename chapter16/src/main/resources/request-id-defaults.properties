# Defaults shipped by the request-id starter.
# Loaded by RequestIdEnvironmentPostProcessor and placed at the bottom
# of the property source chain, so any user-supplied value still wins.

# A short, opinionated set of headers to propagate alongside the request id.
# Matches the conventions used by Zipkin (B3), Envoy, and tracing libraries.
request-id.propagate-headers=X-Correlation-Id,X-B3-TraceId

# A reasonable log level for the library's own diagnostics.
logging.level.com.example.requestid=INFO
