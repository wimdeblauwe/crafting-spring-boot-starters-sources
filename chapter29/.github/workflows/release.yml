name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (e.g. 0.1.0)'
        required: true
      nextVersion:
        description: 'Next development version (e.g. 0.2.0-SNAPSHOT)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set release version
        run: >
          mvn -B versions:set
          -DnewVersion=${{ inputs.releaseVersion }}
          -DprocessAllModules
          -DgenerateBackupPoms=false

      - name: Commit release version
        run: |
          git commit -am "Release ${{ inputs.releaseVersion }}"
          git push

      - name: Stage artifacts
        run: >
          mvn -B deploy
          -DaltDeploymentRepository=local::file:./target/staging-deploy

      - name: Release with JReleaser
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
        run: mvn -B jreleaser:full-release

      - name: Upload JReleaser logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-logs
          path: |
            target/jreleaser/trace.log
            target/jreleaser/output.properties

      - name: Set next development version
        run: >
          mvn -B versions:set
          -DnewVersion=${{ inputs.nextVersion }}
          -DprocessAllModules
          -DgenerateBackupPoms=false

      - name: Commit next development version
        run: |
          git commit -am "Prepare for next development iteration: ${{ inputs.nextVersion }}"
          git push
